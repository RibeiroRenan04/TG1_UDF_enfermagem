<mat-sidenav-container class="app-container">

  <!-- Sidenav: fixa ao lado no computador; no celular abre por cima, em tela cheia. -->
  <mat-sidenav #sidenav class="sidenav"
               [mode]="compacto() ? 'over' : 'side'"
               [opened]="!compacto() && menuAberto()"
               [fixedInViewport]="compacto()"
               (openedChange)="aoMudarMenu($event)">
    <div class="brand">
      <img src="assets/logo.png" alt="EstágioCheck" class="brand-logo">
      <span class="brand-title">EstágioCheck</span>
      <button mat-icon-button class="fechar-menu" *ngIf="compacto()" (click)="sidenav.close()"
              aria-label="Fechar menu">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <mat-nav-list>
      <a mat-list-item
         *ngFor="let item of navItems()"
         [routerLink]="item.path"
         [replaceUrl]="compacto() && !ativo(item)"
         (click)="aoEscolherItem(item)"
         routerLinkActive="active-link"
         [routerLinkActiveOptions]="{ exact: item.path === '/app' }">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    </mat-nav-list>

    <div class="spacer"></div>

    <div class="user-info">
      <div class="user-avatar">{{ (user()?.fullName || user()?.email || 'U').charAt(0).toUpperCase() }}</div>
      <div class="user-details">
        <div class="user-name">{{ user()?.fullName }}</div>
        <div class="user-email">{{ user()?.email }}</div>
        <div class="user-role">{{ rotuloPerfil() }}</div>
        <div class="user-turma" *ngIf="turmaAluno() as t" [matTooltip]="t">{{ t }}</div>
      </div>
      <button mat-icon-button (click)="logout()" class="logout-btn" matTooltip="Sair">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </mat-sidenav>

  <!-- Main content -->
  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      <button mat-icon-button (click)="alternarMenu()" aria-label="Menu">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">EstágioCheck</span>
      <span class="toolbar-spacer"></span>
      <span class="readonly-badge" *ngIf="somenteLeitura()" matTooltip="Perfil de consulta: alterações estão desabilitadas">
        <mat-icon>visibility</mat-icon> <span class="readonly-texto">Somente leitura</span>
      </span>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>
